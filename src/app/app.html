<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo"><app-icon name="processes" /></span>
      <span>Webase<small>System Monitor</small></span>
    </div>

    <nav aria-label="Sections">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><app-icon name="dashboard" />Dashboard</a>
      <a routerLink="/software" routerLinkActive="active"><app-icon name="software" />Software</a>
      <a routerLink="/updates" routerLinkActive="active"><app-icon name="download" />App updates</a>
      <a routerLink="/find" routerLinkActive="active"><app-icon name="search" />Find apps</a>
      <a routerLink="/processes" routerLinkActive="active"><app-icon name="processes" />Processes</a>
      <a routerLink="/startup" routerLinkActive="active"><app-icon name="power" />Startup</a>
      <a routerLink="/cleanup" routerLinkActive="active"><app-icon name="trash" />Cleanup</a>
      <a routerLink="/disk" routerLinkActive="active"><app-icon name="disk" />Disk space</a>
      <a routerLink="/backups" routerLinkActive="active"><app-icon name="archive" />Backups</a>
      <a routerLink="/drivers" routerLinkActive="active"><app-icon name="board" />Drivers</a>
      <a routerLink="/blocked" routerLinkActive="active"><app-icon name="shield" />Blocked</a>
    </nav>

    <div class="appearance">
      <span class="caption" id="theme-label">Appearance</span>
      <div class="theme" role="group" aria-labelledby="theme-label">
        @for (m of modes; track m.id) {
          <button type="button" [attr.aria-pressed]="theme.mode() === m.id" [attr.aria-label]="m.label" [title]="m.label" (click)="theme.set(m.id)">
            <app-icon [name]="m.icon" />
          </button>
        }
      </div>
    </div>
  </aside>

  <main>
    <router-outlet />
  </main>
</div>
<app-ui-host />
